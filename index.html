<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Real Soccer 6</title>
<link rel="icon" type="image/svg+xml" href="icon.svg?v=1.21.0">
<link rel="stylesheet" href="css/style.css?v=1.21.0">
</head>
<body>

<canvas id="game-canvas"></canvas>

<!-- In-match HUD (always left-to-right, even in Arabic) -->
<div id="hud" class="hidden" dir="ltr">
  <div id="hud-top">
    <div class="board glass">
      <span id="hud-comp" class="chip"></span>
      <span class="team"><i id="hud-home-badge" class="badge"></i><span id="hud-home-name"></span><span id="hud-home-cards" class="mini-cards"></span></span>
      <span class="score"><span id="hud-score-home">0</span> - <span id="hud-score-away">0</span></span>
      <span class="team"><span id="hud-away-cards" class="mini-cards"></span><span id="hud-away-name"></span><i id="hud-away-badge" class="badge"></i></span>
      <span id="hud-clock" class="clock">00:00</span>
    </div>
    <div id="hud-telemetry" class="glass pill" style="display:none">FPS <b id="hud-fps">60</b> <span>|</span> <b id="hud-quality">AUTO</b></div>
  </div>

  <!-- checkoAI: what it is thinking (top-right corner, small, never over the play), the clap gauge and the clap -->
  <div id="aima-box" class="glass hidden"><span id="aima-head"></span><span id="aima-name"></span><span id="aima-ico"></span><span id="aima-txt"></span><i id="aima-gauge"><b></b></i></div>
  <div id="clap-fx" class="hidden"><svg viewBox="0 0 120 100" aria-hidden="true">
    <g class="hand l"><rect x="22" y="30" width="34" height="44" rx="14"/><rect x="24" y="8" width="8" height="30" rx="4"/><rect x="33" y="4" width="8" height="32" rx="4"/><rect x="42" y="6" width="8" height="30" rx="4"/><rect x="50" y="40" width="16" height="9" rx="4.5" transform="rotate(-35 50 44)"/></g>
    <g class="hand r"><rect x="64" y="30" width="34" height="44" rx="14"/><rect x="88" y="8" width="8" height="30" rx="4"/><rect x="79" y="4" width="8" height="32" rx="4"/><rect x="70" y="6" width="8" height="30" rx="4"/><rect x="54" y="40" width="16" height="9" rx="4.5" transform="rotate(35 70 44)"/></g>
    <g class="spark"><path d="M60 0v10M44 4l4 8M76 4l-4 8M30 14l7 5M90 14l-7 5"/></g>
  </svg><b id="clap-pct"></b></div>
  <div id="hud-hint" class="glass hidden"></div>

  <div id="hud-bottom">
    <div class="plate p1 glass">
      <div class="plate-head"><span id="p1-label"></span><span id="p1-role" class="chip"></span></div>
      <div id="p1-name" class="pname"></div>
      <div class="bar"><div id="p1-stamina" class="fill"></div></div>
      <div class="power"><i class="seg pass"></i><i class="seg thr"></i><i class="seg lng"></i><i class="seg sht"></i><b id="p1-mark" class="mark"></b></div>
      <div id="p1-act" class="act" data-act="0"></div>
    </div>

    <div id="hud-radar-box" class="glass"><canvas id="radar-canvas" width="184" height="112"></canvas></div>

    <div class="plate p2 glass">
      <div class="plate-head"><span id="p2-label"></span><span id="p2-role" class="chip"></span></div>
      <div id="p2-name" class="pname"></div>
      <div class="bar"><div id="p2-stamina" class="fill"></div></div>
      <div class="power"><i class="seg pass"></i><i class="seg thr"></i><i class="seg lng"></i><i class="seg sht"></i><b id="p2-mark" class="mark"></b></div>
      <div id="p2-act" class="act" data-act="0"></div>
    </div>
  </div>

  <!-- GOOOAL: letters built by js/ui/hud.js on each goal -->
  <div id="goal-fx" class="hidden"><div class="goal-flash"></div><div id="goal-word" class="goal-word"></div><div id="goal-sub" class="goal-sub"></div></div>

  <div id="event-banner" class="hidden">
    <div class="banner glass">
      <div id="event-title"></div>
      <div id="event-sub"></div>
    </div>
  </div>
</div>

<!-- Menus: navigated with the TV remote (arrows + OK); content is built by js/ui/menu.js -->
<div id="menu-root">
  <div class="menu-panel">
    <div class="menu-head">
      <div class="brand">
        <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
          <path d="M32 4 L56 14 V32 C56 48 32 60 32 60 C32 60 8 48 8 32 V14 Z" fill="#0f172a" stroke="#f59e0b" stroke-width="4"/>
          <circle cx="32" cy="28" r="11" fill="#fff"/>
          <polygon points="32,20 37,24 35,31 29,31 27,24" fill="#0284c7"/>
          <text x="32" y="51" font-family="Arial,sans-serif" font-size="11" font-weight="900" fill="#f59e0b" text-anchor="middle">RS6</text>
        </svg>
        <div>
          <h1>REAL SOCCER <span>6</span><span id="menu-step-badge" class="badge-step"></span></h1>
          <div class="muted small" data-i18n="app.sub"></div>
        </div>
      </div>
      <div class="stats">
        <span><span data-i18n="stat.wins"></span> <b id="menu-stat-wins">0</b></span>
        <span><span data-i18n="stat.cups"></span> <b id="menu-stat-cups">0</b></span>
        <span><span data-i18n="stat.goals"></span> <b id="menu-stat-goals">0</b></span>
      </div>
    </div>

    <section id="screen-main" class="screen"></section>
    <section id="screen-sides" class="screen hidden"></section>
    <section id="screen-teams" class="screen hidden"></section>
    <section id="screen-gameplan" class="screen hidden"></section>
    <section id="screen-comppick" class="screen hidden"></section>
    <section id="screen-comphub" class="screen hidden"></section>
    <section id="screen-pause" class="screen hidden"></section>
    <section id="screen-settings" class="screen hidden"></section>
    <section id="screen-help" class="screen hidden"></section>
    <section id="screen-debug" class="screen hidden"></section>
    <section id="screen-buttons" class="screen hidden"></section>
  </div>
</div>

<!-- My PC SDK first (never copied into this repo), then our own files (all with ?v=<version>) -->
<script src="https://imad-os.github.io/g/sdk/mypc-sdk.js"></script>
<script src="vendor/three.min.js?v=1.21.0"></script>
<script src="js/core/config.js?v=1.21.0"></script>
<script src="js/core/i18n.js?v=1.21.0"></script>
<script src="js/core/bindings.js?v=1.21.0"></script>
<script src="vendor/zzfx.js?v=1.21.0"></script>
<script src="js/core/audio.js?v=1.21.0"></script>
<script src="js/core/storage.js?v=1.21.0"></script>
<script src="js/core/input.js?v=1.21.0"></script>
<script src="js/core/gamepad.js?v=1.21.0"></script>
<script src="js/core/quality.js?v=1.21.0"></script>
<script src="js/data/teams.js?v=1.21.0"></script>
<script src="js/data/players.js?v=1.21.0"></script>
<script src="js/data/formations.js?v=1.21.0"></script>
<script src="js/render/assets.js?v=1.21.0"></script>
<script src="js/render/scene.js?v=1.21.0"></script>
<script src="js/game/world.js?v=1.21.0"></script>
<script src="js/game/actions.js?v=1.21.0"></script>
<script src="js/game/ai.js?v=1.21.0"></script>
<script src="js/game/controls.js?v=1.21.0"></script>
<script src="js/data/aima-cloud.js?v=1.21.0"></script>
<script src="js/game/aima.js?v=1.21.0"></script>
<script src="js/game/match.js?v=1.21.0"></script>
<script src="js/game/comp.js?v=1.21.0"></script>
<script src="js/game/debug.js?v=1.21.0"></script>
<script src="js/ui/hud.js?v=1.21.0"></script>
<script src="js/ui/mapper.js?v=1.21.0"></script>
<script src="js/ui/menu.js?v=1.21.0"></script>
<script src="js/main.js?v=1.21.0"></script>
</body>
</html>
